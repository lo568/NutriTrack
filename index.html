<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NutriTrack</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            color: #F5F7FF;

            background:
                linear-gradient(
                    180deg,
                    #2A1C6E 0%,
                    #111A48 50%,
                    #08122B 100%
                );

            padding: 25px 18px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-dot {
            width: 14px;
            height: 14px;

            border-radius: 50%;

            background: #8CB4FF;

            box-shadow:
                0 0 18px rgba(140, 180, 255, 0.8);
        }

        h1 {
            margin: 0;

            font-size: 30px;
        }

        .subtitle {
            margin-top: 6px;

            color: #A3ADD6;

            font-size: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 25px;

            padding: 22px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        input,
        select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 14px;

            outline: none;

            background: rgba(0, 0, 0, 0.20);

            color: white;

            font-size: 15px;
        }

        select option {
            background: #111A48;
            color: white;
        }

        input:focus,
        select:focus {
            border-color: #8CB4FF;
        }

        button {

            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: none;

            border-radius: 18px;

            background: #8CB4FF;

            color: #0B1236;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            display: none;

            margin-top: 20px;
        }

        .calories {

            text-align: center;

            background: #6C63FF;

            border-radius: 20px;

            padding: 20px;

            margin-bottom: 15px;
        }

        .calories-title {
            font-size: 12px;

            color: #E4E2FF;

            font-weight: bold;
        }

        .calories-value {
            margin-top: 5px;

            font-size: 30px;

            font-weight: bold;
        }

        .macros {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;
        }

        .macro {

            text-align: center;

            padding: 15px 5px;

            border-radius: 18px;

            background: rgba(0, 0, 0, 0.18);
        }

        .macro-name {

            margin-top: 5px;

            color: #A3ADD6;

            font-size: 12px;
        }

        .macro-value {

            margin-top: 5px;

            font-size: 17px;

            font-weight: bold;
        }

        .protein {
            color: #5CE1FF;
        }

        .fat {
            color: #FFD479;
        }

        .carbs {
            color: #FF9BD2;
        }

        .info {

            margin-top: 15px;

            padding: 15px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.08);

            color: #A3ADD6;

            font-size: 13px;

            line-height: 1.7;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">

            <div class="logo-dot"></div>

            <h1>NutriTrack</h1>

        </div>

        <div class="subtitle">
            Персональный расчёт КБЖУ
        </div>

    </div>


    <div class="card">

        <div class="field">

            <label>Пол</label>

            <select id="gender">

                <option value="male">
                    Мужчина
                </option>

                <option value="female">
                    Женщина
                </option>

            </select>

        </div>


        <div class="field">

            <label>Возраст</label>

            <input
                id="age"
                type="number"
                placeholder="Например, 18"
            >

        </div>


        <div class="field">

            <label>Рост (см)</label>

            <input
                id="height"
                type="number"
                placeholder="Например, 179"
            >

        </div>


        <div class="field">

            <label>Вес (кг)</label>

            <input
                id="weight"
                type="number"
                placeholder="Например, 80"
            >

        </div>


        <div class="field">

            <label>Активность</label>

            <select id="activity">

                <option value="1.2">
                    Минимальная
                </option>

                <option value="1.375">
                    Низкая
                </option>

                <option value="1.55" selected>
                    Средняя
                </option>

                <option value="1.725">
                    Высокая
                </option>

                <option value="1.9">
                    Очень высокая
                </option>

            </select>

        </div>


        <div class="field">

            <label>Цель</label>

            <select id="goal">

                <option value="loss">
                    Похудение
                </option>

                <option value="maintain">
                    Поддержание
                </option>

                <option value="gain">
                    Набор массы
                </option>

            </select>

        </div>


        <button onclick="calculate()">
            Рассчитать
        </button>


        <div class="result" id="result">

            <div class="calories">

                <div class="calories-title">
                    ДНЕВНАЯ НОРМА
                </div>

                <div
                    class="calories-value"
                    id="calories"
                >
                    0 ккал
                </div>

            </div>


            <div class="macros">

                <div class="macro">

                    🥩

                    <div class="macro-name">
                        Белки
                    </div>

                    <div
                        class="macro-value protein"
                        id="protein"
                    >
                        0 г
                    </div>

                </div>


                <div class="macro">

                    🥑

                    <div class="macro-name">
                        Жиры
                    </div>

                    <div
                        class="macro-value fat"
                        id="fat"
                    >
                        0 г
                    </div>

                </div>


                <div class="macro">

                    🍚

                    <div class="macro-name">
                        Углеводы
                    </div>

                    <div
                        class="macro-value carbs"
                        id="carbs"
                    >
                        0 г
                    </div>

                </div>

            </div>


            <div class="info">

                <div id="bmi">
                    📊 ИМТ
                </div>

                <div id="bmr">
                    ⚡ Базовый обмен
                </div>

                <div id="maintenance">
                    ⚖ Поддержание
                </div>

            </div>

        </div>

    </div>

</div>


<script>

function calculate() {

    const gender =
        document.getElementById("gender").value;

    const age =
        Number(document.getElementById("age").value);

    const height =
        Number(document.getElementById("height").value);

    const weight =
        Number(document.getElementById("weight").value);

    const activity =
        Number(document.getElementById("activity").value);

    const goal =
        document.getElementById("goal").value;


    if (!age || !height || !weight) {

        alert("Заполните все поля");

        return;

    }


    let bmr;


    if (gender === "male") {

        bmr =
            (10 * weight)
            + (6.25 * height)
            - (5 * age)
            + 5;

    } else {

        bmr =
            (10 * weight)
            + (6.25 * height)
            - (5 * age)
            - 161;

    }


    const maintenance =
        bmr * activity;


    let calories;


    if (goal === "loss") {

        calories =
            maintenance * 0.85;

    } else if (goal === "gain") {

        calories =
            maintenance * 1.15;

    } else {

        calories =
            maintenance;

    }


    calories =
        Math.round(calories);


    const protein =
        Math.round(weight * 1.6);


    const fat =
        Math.round(weight * 0.8);


    let carbCalories =
        calories
        - (protein * 4)
        - (fat * 9);


    if (carbCalories < 0) {

        carbCalories = 0;

    }


    const carbs =
        Math.round(carbCalories / 4);


    const heightMeters =
        height / 100;


    const bmi =
        weight /
        (heightMeters * heightMeters);


    let bmiText;


    if (bmi < 18.5) {

        bmiText =
            "Недостаточная масса тела";

    } else if (bmi < 25) {

        bmiText =
            "Нормальная масса тела";

    } else if (bmi < 30) {

        bmiText =
            "Избыточная масса тела";

    } else {

        bmiText =
            "Ожирение";

    }


    document.getElementById("calories")
        .textContent =
        calories + " ккал";


    document.getElementById("protein")
        .textContent =
        protein + " г";


    document.getElementById("fat")
        .textContent =
        fat + " г";


    document.getElementById("carbs")
        .textContent =
        carbs + " г";


    document.getElementById("bmi")
        .textContent =
        "📊 ИМТ " +
        bmi.toFixed(1) +
        " • " +
        bmiText;


    document.getElementById("bmr")
        .textContent =
        "⚡ Базовый обмен " +
        Math.round(bmr) +
        " ккал";


    document.getElementById("maintenance")
        .textContent =
        "⚖ Поддержание " +
        Math.round(maintenance) +
        " ккал";


    document.getElementById("result")
        .style.display =
        "block";

}

</script>

</body>
</html>
